version: "3.8"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cazacasas
      POSTGRES_USER: cazacasas
      POSTGRES_PASSWORD: cazacasas
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cazacasas
      SPRING_DATASOURCE_USERNAME: cazacasas
      SPRING_DATASOURCE_PASSWORD: cazacasas
      JWT_SECRET: this-is-a-very-long-secret-key-for-jwt-signing-1234567890
  frontend:
    build: ./frontend
    ports:
      - "5174:5174"
    depends_on:
      - backend
volumes:
  pg_data:
